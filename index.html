--t-teal:#E3F2F1;--t-navy:#E6E9F2;--t-pink:#FBEAF0;--t-sage:#EBF3E8;--t-lav:#EFEBF8;--t-sky:#E6F1F9;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 "SSP",system-ui,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3,.serif{font-family:"DMS",Georgia,serif;font-weight:400;color:var(--navy);margin:0}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:480px;margin:0 auto;padding:14px 16px 24px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
.top .logo{display:flex;align-items:center;gap:9px}.top .date{color:var(--grey);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:99px;padding:5px 11px;font-weight:600;font-size:13px;color:var(--navy);box-shadow:0 1px 3px rgba(30,42,74,.08)}
.card{background:#fff;border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(30,42,74,.06)}
.card.tint-teal{background:var(--t-teal)}.card.tint-pink{background:var(--t-pink)}.card.tint-lav{background:var(--t-lav)}.card.tint-sage{background:var(--t-sage)}.card.tint-sky{background:var(--t-sky)}
.hero{background:linear-gradient(150deg,#fff 0%,var(--t-teal) 60%,var(--t-lav) 100%);padding:20px;position:relative;overflow:hidden}
.hero .kick{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.hero h2{font-size:27px;margin:6px 0 4px;padding-right:56px}.hero .meta{color:var(--grey);font-size:14px}
.hero .first{margin:10px 0 16px;font-size:16px}
.hero .ring{position:absolute;right:-18px;top:-18px;width:96px;height:96px;border-radius:50%;border:9px solid var(--pink);opacity:.55}
.hero .ring:after{content:"";position:absolute;inset:14px;border-radius:50%;border:7px solid var(--teal);opacity:.8}
.btn{background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.big{width:100%;padding:17px;font-size:19px;border-radius:16px}
.btn.teal{background:var(--teal)}.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}.btn.soft{background:var(--t-navy);color:var(--navy)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:11px}
.row{display:flex;gap:8px;align-items:center}.row.wrapx{flex-wrap:wrap}.grow{flex:1}.mt{margin-top:10px}.mt2{margin-top:18px}.muted{color:var(--grey)}.small{font-size:13px}.center{text-align:center}
.emojis{display:flex;justify-content:space-between;gap:6px;margin-top:10px}
.emo{flex:1;background:var(--cream);border-radius:14px;padding:9px 2px 6px;font-size:28px;line-height:1;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .15s}
.emo span{font-size:10.5px;color:var(--grey);font-family:"SSP"}.emo.on{background:var(--t-teal);outline:2px solid var(--teal);transform:scale(1.06)}
.plan-mini{display:flex;gap:12px;align-items:center}.dot-g{width:12px;height:12px;border-radius:50%;flex:none}

<script>const DATA={"ex": [{"id": "anchor", "title": "Attention-anchor breathing", "mins": "5–10", "use": "you feel scattered, before a demanding task.", "steps": ["Sit upright and comfortable. Set a timer for 5 minutes.", "Breathe normally and count each out-breath from 1 to 10, then start again at 1.", "When you notice you have lost count or drifted, note ‘wandering’ and gently restart at 1.", "Afterwards, write down roughly how many times you drifted. Fewer is not the goal – noticing is."], "why": "Repeatedly noticing mind-wandering and returning is the core skill of focused-attention practice.", "ev": "Jha et al., 2007; Zeidan et al., 2010", "group": "attn", "diff": 1, "tmin": 5, "tool": "count", "quick": true, "multi": false}, {"id": "box", "title": "Box breathing", "mins": "3–5", "use": "you feel tense or rushed before a meeting or hard task.", "steps": ["Breathe in through the nose for a count of 4.", "Hold gently for 4.", "Breathe out slowly for 4.", "Hold for 4. Repeat for 3–5 minutes. Stop if you feel dizzy."], "why": "Slow, structured breathing can lower physiological arousal and improve mood for many people.", "ev": "Balban et al., 2023; Zaccaro et al., 2018", "group": "body", "diff": 1, "tmin": 3, "tool": "breath:box", "quick": true, "multi": false}, {"id": "slow", "title": "Slow breathing (long exhale)", "mins": "3–5", "use": "stress is high and you need to settle quickly.", "steps": ["Breathe in through the nose for about 4 seconds.", "Breathe out slowly for about 6 seconds, as if through a straw.", "Continue for 3–5 minutes (about six breaths per minute).", "Notice any change in tension, then return to your task."], "why": "Breathing at about six breaths per minute is linked with calmer physiological states in many studies.", "ev": "Zaccaro et al., 2018", "group": "body", "diff": 1, "tmin": 4, "tool": "breath:slow", "quick": true, "multi": false}, {"id": "ground", "title": "5-4-3-2-1 grounding", "mins": "2–3", "use": "your thoughts are racing and you need a quick reset.", "steps": ["Name 5 things you can see.", "4 things you can feel (feet on floor, chair, air).", "3 things you can hear.", "2 things you can smell and 1 thing you can taste."], "why": "It steers attention to the present senses. It is a widely used grounding technique, though direct research on it is limited.", "ev": "Practice-based technique", "group": "attn", "diff": 1, "tmin": 3, "tool": "ground", "quick": true, "multi": false}, {"id": "sprint", "title": "Single-task sprint (Pomodoro)", "mins": "25 + 5", "use": "you need to start or push through a task.", "steps": ["Choose one task and write down what ‘done for now’ means.", "Set a timer for 25 minutes (or 15 if starting out). Work only on that task.", "If a distraction appears, write it in your parking lot and return.", "Take a real 5-minute break away from the screen. After four sprints, take a longer break."], "why": "Time-boxing with one clear goal reduces switching. The exact 25/5 split is a convention, not a magic number – adjust it.", "ev": "Cirillo, 2018; Monsell, 2003", "group": "deep", "diff": 2, "tmin": 25, "tool": "timer", "quick": false, "multi": false}, {"id": "parking", "title": "Distraction parking lot", "mins": "all day", "use": "to-dos and ideas keep interrupting your work.", "steps": ["Keep a sheet or note beside you.", "When a thought or urge appears, write 2–5 words and when you will deal with it.", "Return to your task immediately.", "Process the list at a planned time (e.g. end of a sprint)."], "why": "Making a concrete plan for an open task can reduce intrusive thoughts about it.", "ev": "Masicampo & Baumeister, 2011", "group": "deep", "diff": 1, "tmin": 5, "tool": "dump", "quick": false, "multi": true}, {"id": "ifthen", "title": "If-then plans", "mins": "10", "use": "you keep falling into the same distraction.", "steps": ["Pick a recurring distraction (e.g. checking news when stuck).", "Write a plan: ‘If [situation], then I will [specific action].’", "Example: ‘If I reach for my phone during a sprint, then I will put it in the drawer and take one breath.’", "Read your plans aloud each morning for a week."], "why": "Implementation intentions have a medium-to-large average effect on reaching goals in a meta-analysis.", "ev": "Gollwitzer, 1999; Gollwitzer & Sheeran, 2006", "group": "plan", "diff": 1, "tmin": 10, "tool": "write", "quick": false, "multi": false}, {"id": "phone", "title": "Phone-out-of-room experiment", "mins": "60–120", "use": "you want to test how your phone affects your focus.", "steps": ["Choose a focused task of 60–120 minutes.", "Put your phone (silent) in another room. Tell people how to reach you in an emergency.", "Work, then rate focus 1–10 and note how often you thought about the phone.", "Compare with a similar session with the phone on the desk."], "why": "One study found that a phone’s mere presence reduced performance; replications are mixed. Your own comparison is the useful test.", "ev": "Ward et al., 2017; Ruiz Pardo & Minda, 2022", "group": "env", "diff": 2, "tmin": 60, "tool": "timer", "quick": false, "multi": false}, {"id": "deep", "title": "Deep-work block", "mins": "60–90", "use": "you have important work that needs long, uninterrupted thinking.", "steps": ["Use the timer and write the plan in a note. Book a 60–90 minute block in your calendar.", "Define the outcome, gather materials and close everything else beforehand.", "Turn off notifications and set an auto-reply or ‘busy’ status if possible.", "Afterwards, note what you produced and what interrupted you."], "why": "Protected, planned time reduces interruptions and switching, which are known to cost time and add stress.", "ev": "Newport, 2016; Mark et al., 2008", "group": "deep", "diff": 3, "tmin": 60, "tool": "timer", "quick": false, "multi": false}, {"id": "stroop", "title": "Stroop drill (paper)", "mins": "5", "use": "you want a quick attention warm-up and self-check.", "steps": ["Use the in-app drill or the book’s drill page. Time yourself naming the INK colours of block A aloud.", "Then time block B, where the word and ink colour clash.", "Write both times. The difference shows the effort of overriding a habit.", "Repeat on another day if you wish – treat it as a warm-up, not a brain upgrade."], "why": "Naming ink colours that clash with the word requires inhibitory control. Practice improves this task more than daily life.", "ev": "Stroop, 1935; Simons et al., 2016", "group": "drill", "diff": 1, "tmin": 3, "tool": "stroop", "quick": true, "multi": false}, {"id": "nback", "title": "n-back drill (paper)", "mins": "5–10", "use": "you want to practise holding information in mind.", "steps": ["Use the in-app drill or the book’s drill page. Cover each row with a card and reveal one letter at a time.", "1-back: circle a letter that matches the letter just before it.", "2-back: circle a letter that matches the letter two places back.", "Check your count with the answer key."], "why": "n-back tasks load working memory. Gains are mostly specific to the task; use it as a focused warm-up.", "ev": "Kirchner, 1958; Melby-Lervåg & Hulme, 2013", "group": "drill", "diff": 2, "tmin": 5, "tool": "nback", "quick": true, "multi": false}, {"id": "cancel", "title": "Letter search drill", "mins": "3–5", "use": "you want a short exercise in sustained, careful search.", "steps": ["Use the in-app drill or the book’s drill page. Start a timer.", "Cross out every letter shown in the target box, row by row, without skipping.", "Stop the timer and count misses using the answer key.", "Notice when your attention slipped – usually near the end."], "why": "Cancellation tasks require steady, selective attention. Like other drills, the benefit is mostly practice and self-observation.", "ev": "Simons et al., 2016", "group": "drill", "diff": 1, "tmin": 4, "tool": "schulte", "quick": true, "multi": false}, {"id": "walk", "title": "Mindful walking", "mins": "10", "use": "you feel restless and need a break that does not involve a screen.", "steps": ["Walk slowly indoors or outside, without headphones.", "Feel each foot lift, move and touch the ground.", "When your mind drifts, notice it and return to the feet.", "Finish by noticing three things you can see around you."], "why": "Walking practices are part of mindfulness training programmes and combine light movement with attention practice.", "ev": "Kabat-Zinn, 1990", "group": "attn", "diff": 1, "tmin": 10, "tool": "guide", "quick": false, "multi": false}, {"id": "nature", "title": "Nature break", "mins": "10–20", "use": "you feel mentally tired after long concentration.", "steps": ["Go to a park, tree-lined street or garden (or look at greenery from a window).", "Leave the phone in your pocket. Let your attention rest on leaves, sky, water.", "Do not try to solve problems – just look and listen.", "Rate your mental freshness before and after (1–10)."], "why": "Attention restoration theory proposes that natural settings let directed attention recover. A walk in nature improved a memory-span task in one study.", "ev": "Kaplan, 1995; Berman et al., 2008", "group": "recover", "diff": 1, "tmin": 15, "tool": "guide", "quick": false, "multi": false}, {"id": "scan", "title": "Body scan", "mins": "10–15", "use": "you are tense, or before sleep.", "steps": ["Lie or sit comfortably and close your eyes if you wish.", "Move attention slowly from toes to head, noticing sensations without changing them.", "When the mind wanders, return to the body part you were on.", "Finish with three slow breaths."], "why": "The body scan is a core practice in mindfulness-based programmes and trains sustained, gentle attention.", "ev": "Kabat-Zinn, 1990; Tang et al., 2015", "group": "attn", "diff": 1, "tmin": 10, "tool": "guide", "quick": false, "multi": false}, {"id": "gaze", "title": "Dot gazing and eye breaks", "mins": "2–5", "use": "your eyes and mind feel tired from screens.", "steps": ["Draw a small dot on paper and place it at eye level, about an arm’s length away.", "Rest your gaze on the dot for 1–2 minutes, blinking normally. Return when your eyes or mind wander.", "During screen work, every 20 minutes look at something about 20 feet (6 m) away for 20 seconds.", "A candle can be used instead of a dot – never leave it unattended."], "why": "A visual anchor works like the breath in focused-attention practice. The 20-20-20 habit is common advice for reducing eye strain; research on gazing practices is limited.", "ev": "Practice-based technique", "group": "attn", "diff": 1, "tmin": 3, "tool": "guide", "quick": true, "multi": false}, {"id": "read", "title": "Reading without switching", "mins": "20–30", "use": "you notice you skim and switch instead of reading deeply.", "steps": ["Choose a chapter or article on paper or in a distraction-free mode.", "Set a timer for 20 minutes and silence your devices.", "Read with a pencil; make a small mark in the margin each time you drift.", "Afterwards, write three key points from memory."], "why": "Uninterrupted reading avoids switching costs, and recalling key points checks that attention stayed with the text.", "ev": "Monsell, 2003; Leroy, 2009", "group": "deep", "diff": 2, "tmin": 20, "tool": "count", "quick": false, "multi": false}, {"id": "matrix", "title": "Priority matrix", "mins": "15", "use": "everything feels urgent and you do not know where to start.", "steps": ["Draw a 2×2 grid on paper. List today’s tasks.", "Sort them: important & urgent, important & not urgent, urgent & not important, neither.", "Choose ONE important task as today’s top priority and schedule it.", "Decide what to delegate, shorten or drop."], "why": "Deciding priorities in advance reduces in-the-moment decisions and pulls attention toward what matters.", "ev": "Covey et al., 1994", "group": "plan", "diff": 2, "tmin": 15, "tool": "write", "quick": false, "multi": false}, {"id": "onetab", "title": "The one-tab rule", "mins": "1–3 h", "use": "browser tabs and windows multiply while you work.", "steps": ["Before a task, close every tab and app not needed for it.", "Keep one browser tab (or one window) open at a time.", "New idea to look up? Write it in the parking lot instead of opening a tab.", "At the end, note how it felt and what you finished."], "why": "Fewer open options means fewer cues to switch and less attention residue.", "ev": "Leroy, 2009; Wood & Rünger, 2016", "group": "env", "diff": 1, "tmin": 5, "tool": "guide", "quick": true, "multi": false}, {"id": "env", "title": "Environment design checklist", "mins": "20", "use": "you want your space to support focus by default.", "steps": ["Go through the checklist and tick what is already true.", "Choose three items to change today.", "Make the helpful choice easy (book on desk) and the distracting choice harder (apps off home screen).", "Re-check in a week."], "why": "Habits are strongly cued by the environment; changing cues is often more reliable than relying on willpower.", "ev": "Wood & Rünger, 2016", "group": "env", "diff": 1, "tmin": 15, "tool": "guide", "quick": false, "multi": false}, {"id": "notif", "title": "Notification and email batching", "mins": "15", "use": "constant pings break your work into fragments.", "steps": ["List every app that can notify you. Turn off all non-essential notifications.", "Choose 2–3 fixed times a day to check email and messages.", "Tell colleagues how to reach you for something truly urgent.", "Notice how your stress and focus change over the week."], "why": "In a field experiment, checking email three times a day instead of constantly reduced daily stress.", "ev": "Kushlev & Dunn, 2015; Mark et al., 2008", "group": "env", "diff": 1, "tmin": 10, "tool": "guide", "quick": false, "multi": false}, {"id": "energy", "title": "Energy and sleep tracker", "mins": "2 min / day", "use": "you want to see how sleep, caffeine and movement affect your focus.", "steps": ["Each morning, fill in a row of the tracker.", "Record bedtime, wake time, sleep quality, movement and caffeine time.", "In the evening, add your focus rating.", "After a week, look for patterns rather than single days."], "why": "Short sleep clearly impairs attention; tracking makes the link visible in your own life.", "ev": "Lim & Dinges, 2010; Harkin et al., 2016", "group": "body", "diff": 1, "tmin": 2, "tool": "guide", "quick": false, "multi": true}, {"id": "sunset", "title": "Digital sunset", "mins": "60", "use": "late screen use pushes back your sleep.", "steps": ["Choose a time 60 minutes before bed for screens to go off.", "Charge your phone outside the bedroom and use a simple alarm clock.", "Replace scrolling with a paper book, stretching or tidying.", "Note sleep quality and next-day focus."], "why": "Evening use of light-emitting devices delayed sleep-related hormone timing and reduced next-morning alertness in a lab study.", "ev": "Chang et al., 2015", "group": "body", "diff": 2, "tmin": 5, "tool": "guide", "quick": true, "multi": false}, {"id": "move", "title": "Movement snack", "mins": "5–10", "use": "you feel sluggish before a focused task.", "steps": ["Do 5–10 minutes of brisk walking, stairs or simple exercises.", "Aim for slightly breathless but able to talk.", "Drink some water.", "Start your focused task straight away."], "why": "A meta-analysis found a small positive effect of a single exercise session on cognitive performance.", "ev": "Chang et al., 2012", "group": "body", "diff": 1, "tmin": 5, "tool": "guide", "quick": true, "multi": false}, {"id": "shutdown", "title": "Shutdown ritual", "mins": "10", "use": "work thoughts follow you into the evening.", "steps": ["At the end of the workday, review open tasks and messages.", "For each open loop, write the next step and when you will do it.", "Choose tomorrow’s top priority.", "Say a closing phrase (e.g. ‘Shutdown complete’) and stop work."], "why": "Making a concrete plan for unfinished goals reduced their intrusion into later tasks in experiments.", "ev": "Masicampo & Baumeister, 2011; Newport, 2016", "group": "recover", "diff": 1, "tmin": 5, "tool": "write", "quick": true, "multi": false}, {"id": "mwcheck", "title": "Mind-wandering check-ins", "mins": "all day", "use": "you want to understand when and where your mind drifts.", "steps": ["Set 4–6 random reminders across the day (or use the start of every hour).", "When one goes off, ask: ‘Was I on task? Where was my mind?’", "Tick on task / off task and note the topic.", "In the evening, look for patterns by time and activity."], "why": "Experience sampling shows mind-wandering is common; simply noticing it is the first step to returning.", "ev": "Killingsworth & Gilbert, 2010; Smallwood & Schooler, 2015", "group": "attn", "diff": 1, "tmin": 3, "tool": "guide", "quick": false, "multi": true}, {"id": "weekly", "title": "Weekly review", "mins": "5–20", "use": "at the end of each week.", "steps": ["Look back at your daily ratings and notes.", "Write what helped, what got in the way and one lesson.", "Write one if-then plan for the coming week.", "Choose and schedule next week’s focus blocks."], "why": "Regularly monitoring progress toward a goal increases the chance of reaching it, especially when progress is written down.", "ev": "Harkin et al., 2016", "group": "plan", "diff": 1, "tmin": 5, "tool": "write", "quick": true, "multi": false}, {"id": "openmon", "title": "Open-awareness sit", "mins": "5–10", "use": "you want to practise noticing without getting pulled along.", "steps": ["Sit comfortably and set a timer.", "Let sounds, sensations and thoughts come and go – notice each one briefly, like cars passing.", "When you realise you are following a thought, note ‘thinking’ and widen your attention again."], "why": "Noticing experiences without following them is a core skill in mindfulness programmes; effects on attention in studies are real but modest.", "ev": "Tang et al., 2015", "group": "attn", "diff": 2, "tmin": 5, "tool": "guide", "quick": true, "multi": false}, {"id": "noting", "title": "Mental noting", "mins": "5", "use": "your mind is busy and you want to see what it is doing.", "steps": ["Sit or walk for 5 minutes.", "Silently label what takes your attention: ‘hearing’, ‘planning’, ‘worrying’, ‘itching’.", "Keep labels short and gentle, then return to the breath."], "why": "Labelling turns automatic drifting into something you can see, which makes it easier to come back.", "ev": "Practice-based technique; Tang et al., 2015", "group": "attn", "diff": 2, "tmin": 5, "tool": "count", "quick": true, "multi": false}, {"id": "sound", "title": "Sound anchor", "mins": "3–5", "use": "breathing exercises feel uncomfortable or boring.", "steps": ["Close your eyes or lower your gaze.", "Pick one steady sound (fan, traffic, rain) and rest attention on it.", "When the mind drifts, return to the sound."], "why": "Any steady anchor can be used to practise returning attention; sound is a good alternative to the breath.", "ev": "Practice-based technique", "group": "attn", "diff": 1, "tmin": 3, "tool": "guide", "quick": true, "multi": false}, {"id": "urge", "title": "Urge surfing", "mins": "2–5", "use": "you feel a strong urge to check your phone or switch tasks.", "steps": ["Pause and notice the urge in your body (tension, restlessness).", "Watch it rise, peak and fade like a wave, without acting on it – usually within a few minutes.", "Then choose: return to the task or take a planned break."], "why": "Observing cravings without acting on them reduced acting on urges in a study with smokers; applied here to digital urges as an experiment.", "ev": "Bowen & Marlatt, 2009", "group": "attn", "diff": 2, "tmin": 3, "tool": "guide", "quick": true, "multi": false}, {"id": "onebreath", "title": "One-breath reset", "mins": "1", "use": "you are moving between tasks or meetings.", "steps": ["Stop for one slow breath in and a longer breath out.", "Ask: ‘What am I doing next?’", "Start that one thing."], "why": "A tiny pause marks the end of one task and the start of the next, which may reduce attention residue.", "ev": "Leroy, 2009", "group": "attn", "diff": 1, "tmin": 1, "tool": "guide", "quick": true, "multi": false}, {"id": "mindeat", "title": "One mindful bite", "mins": "3", "use": "you want a short mindfulness practice that fits into a meal.", "steps": ["Take the first bite of a meal slowly.", "Notice taste, texture, temperature and sounds.", "Eat the rest normally – or continue for a few more bites."], "why": "Mindful eating is used in mindfulness programmes to practise full attention on an ordinary activity.", "ev": "Kabat-Zinn, 1990", "group": "attn", "diff": 1, "tmin": 3, "tool": "guide", "quick": true, "multi": false}, {"id": "namefeel", "title": "Name the feeling", "mins": "2", "use": "frustration or anxiety is pulling you away from work.", "steps": ["Pause and ask: ‘What am I feeling right now?’", "Put it into one or two words (bored, anxious, overwhelmed).", "Then choose one small next action."], "why": "Putting feelings into words (‘affect labelling’) reduced emotional reactivity in lab studies.", "ev": "Lieberman et al., 2007", "group": "attn", "diff": 1, "tmin": 2, "tool": "write", "quick": true, "multi": false}, {"id": "diary", "title": "Attention diary", "mins": "3–5", "use": "you want to learn when your focus is best and worst.", "steps": ["At the end of the day, write three lines: best focus moment, worst focus moment, one reason for each.", "Add your focus rating.", "Read back once a week."], "why": "Writing down progress and patterns supports goal attainment in experimental studies.", "ev": "Harkin et al., 2016", "group": "attn", "diff": 1, "tmin": 3, "tool": "write", "quick": true, "multi": false}, {"id": "frogfirst", "title": "Important task at your best time", "mins": "25–60", "use": "your most important work keeps getting pushed to the end of the day.", "steps": ["Check your ratings: when is your focus usually best?", "Book that slot for your most important task.", "Do it before email or messages if you can."], "why": "There is no universal best time; your own ratings are the evidence. Matching hard work to your best hours is a sensible experiment.", "ev": "Self-experiment", "group": "deep", "diff": 3, "tmin": 25, "tool": "timer", "quick": false, "multi": false}, {"id": "batch", "title": "Batch small tasks", "mins": "20–30", "use": "many small tasks keep interrupting your main work.", "steps": ["Collect small tasks (calls, forms, replies) on a list.", "Do them together in one block.", "Protect the rest of the day for bigger work."], "why": "Grouping similar tasks reduces the number of switches, and each switch has a cost.", "ev": "Monsell, 2003", "group": "deep", "diff": 2, "tmin": 20, "tool": "timer", "quick": false, "multi": false}, {"id": "ladder", "title": "Sprint ladder", "mins": "10–25", "use": "25 minutes feels impossible right now.", "steps": ["Start with a 10-minute single-task sprint.", "Next time try 15, then 20, then 25.", "Stay at the length that works; going back down is fine."], "why": "Building gradually from a length you can manage makes it easier to keep practising.", "ev": "Practice-based technique", "group": "deep", "diff": 1, "tmin": 10, "tool": "timer", "quick": false, "multi": false}, {"id": "handnotes", "title": "Notes by hand", "mins": "20", "use": "you take notes while reading or listening.", "steps": ["Use paper for notes in a talk, meeting or reading session.", "Write key ideas in your own words rather than copying.", "Review the notes once the same day."], "why": "One well-known study favoured longhand notes, but a large replication found little difference – the useful part is summarising in your own words.", "ev": "Mueller & Oppenheimer, 2014; Morehead et al., 2019", "group": "deep", "diff": 2, "tmin": 20, "tool": "guide", "quick": false, "multi": false}, {"id": "convo", "title": "Phone-free conversation", "mins": "15", "use": "you want to give someone your full attention.", "steps": ["Put your phone away (not face-down on the table) before talking.", "Listen without planning your reply.", "Afterwards, notice how the conversation felt."], "why": "In one study, the mere presence of a phone during conversation lowered reported closeness; results are not settled, so test it.", "ev": "Przybylski & Weinstein, 2013", "group": "deep", "diff": 1, "tmin": 15, "tool": "guide", "quick": false, "multi": false}, {"id": "mit3", "title": "Three most important tasks", "mins": "5", "use": "your to-do list is long and paralysing.", "steps": ["Write all tasks down.", "Circle three that matter most today.", "Start with the first; everything else is a bonus."], "why": "Fewer, clearer goals make it easier to decide what to attend to next.", "ev": "Locke & Latham, 2002", "group": "plan", "diff": 1, "tmin": 5, "tool": "write", "quick": true, "multi": false}, {"id": "definedone", "title": "Define ‘done’", "mins": "3", "use": "tasks feel vague and you drift.", "steps": ["Before starting, write one sentence: ‘This session is done when …’.", "Make it concrete (e.g. ‘draft of section 2, rough is fine’).", "Stop and tick it when you get there."], "why": "Specific, clear goals lead to better performance than vague ‘do your best’ goals.", "ev": "Locke & Latham, 2002", "group": "plan", "diff": 1, "tmin": 3, "tool": "write", "quick": true, "multi": false}, {"id": "woop", "title": "WOOP", "mins": "5–10", "use": "you want to plan a goal and its obstacles realistically.", "steps": ["Wish: what do you want to focus on today?", "Outcome: imagine the best result. Obstacle: what inside you could stop it?", "Plan: ‘If [obstacle], then I will [action].’"], "why": "Mental contrasting combined with if-then plans has supported goal pursuit across many studies.", "ev": "Oettingen, 2012; Gollwitzer & Sheeran, 2006", "group": "plan", "diff": 2, "tmin": 5, "tool": "write", "quick": true, "multi": false}, {"id": "premortem", "title": "Distraction pre-mortem", "mins": "5", "use": "before an important focus session.", "steps": ["Imagine the session is over and it went badly.", "List the three most likely reasons (phone, hunger, unclear task …).", "Fix or plan for each one before you start."], "why": "Imagining failure in advance helps spot problems you would otherwise miss; it is a widely used planning method.", "ev": "Klein, 2007", "group": "plan", "diff": 2, "tmin": 5, "tool": "write", "quick": true, "multi": false}, {"id": "bundle", "title": "Temptation bundling", "mins": "varies", "use": "a task is boring and easy to avoid.", "steps": ["Pick something you enjoy (a special playlist, a favourite drink).", "Allow it only while doing the boring task.", "Keep the pairing consistent."], "why": "Pairing a treat with a ‘should’ activity increased gym visits in a field experiment.", "ev": "Milkman et al., 2014", "group": "plan", "diff": 1, "tmin": 5, "tool": "guide", "quick": true, "multi": false}, {"id": "returnplan", "title": "The return plan", "mins": "2", "use": "you often notice drifting but struggle to come back.", "steps": ["Write: ‘If I notice I have drifted, then I will say “back” and reread the last line.’", "Use it every time today.", "Count how often it worked."], "why": "A pre-made if-then response makes the return automatic instead of a new decision each time.", "ev": "Gollwitzer & Sheeran, 2006", "group": "plan", "diff": 1, "tmin": 2, "tool": "write", "quick": true, "multi": false}, {"id": "weekplan", "title": "Weekly planning", "mins": "15–20", "use": "at the start of each week.", "steps": ["Look at the week’s calendar.", "Book two or three focus blocks and one recovery activity.", "Write one if-then plan for the hardest moment of the week."], "why": "Planning and monitoring progress both support goal attainment.", "ev": "Harkin et al., 2016; Gollwitzer, 1999", "group": "plan", "diff": 2, "tmin": 15, "tool": "write", "quick": false, "multi": false}, {"id": "timeblock", "title": "Time-block your day", "mins": "10", "use": "your day disappears into reactive work.", "steps": ["On paper, split the day into blocks (e.g. 30–90 min).", "Give each block one job, including breaks and email.", "When plans change, redraw – the point is deciding, not perfection."], "why": "Deciding in advance what each block is for reduces in-the-moment choices and switching.", "ev": "Newport, 2016", "group": "plan", "diff": 2, "tmin": 10, "tool": "write", "quick": false, "multi": false}, {"id": "grayscale", "title": "Grayscale phone", "mins": "1 day", "use": "your phone feels hard to put down.", "steps": ["Turn on grayscale (accessibility settings) for a day.", "Keep using the phone as normal.", "Note your screen time and how often you picked it up."], "why": "A less colourful screen may feel less rewarding; evidence is limited, so treat it as a personal experiment.", "ev": "Self-experiment", "group": "env", "diff": 1, "tmin": 2, "tool": "guide", "quick": false, "multi": true}, {"id": "homescreen", "title": "Clean home screen", "mins": "10", "use": "you open apps on autopilot.", "steps": ["Move social and news apps off the first screen or into a folder.", "Keep only tools (maps, calendar, camera) on screen one.", "Notice automatic reaching over the next days."], "why": "Habits depend on cues; moving the cue adds a moment of choice.", "ev": "Wood & Rünger, 2016", "group": "env", "diff": 1, "tmin": 10, "tool": "guide", "quick": false, "multi": false}, {"id": "logout", "title": "Log out to add friction", "mins": "5", "use": "you check certain sites without meaning to.", "steps": ["Log out of one or two distracting sites or apps.", "Use long passwords so logging in takes effort.", "Notice how often you stop at the login screen."], "why": "Small amounts of friction make automatic habits less likely to run.", "ev": "Wood & Rünger, 2016", "group": "env", "diff": 1, "tmin": 5, "tool": "guide", "quick": true, "multi": false}, {"id": "soundcheck", "title": "Sound check", "mins": "2 × 25", "use": "you are unsure whether silence or background sound helps you.", "steps": ["Do one sprint in silence (or with earplugs).", "Do another with steady background sound or music without lyrics.", "Compare your focus ratings."], "why": "Effects of background sound differ between people and tasks; your own comparison is the best guide.", "ev": "Self-experiment", "group": "env", "diff": 2, "tmin": 25, "tool": "timer", "quick": false, "multi": false}, {"id": "closechat", "title": "Close chat during focus", "mins": "focus block", "use": "chat apps keep pulling you out of work.", "steps": ["Before a focus block, set your status to busy.", "Quit the chat app completely (not just minimise).", "Check messages at the end of the block."], "why": "Interruptions make people work faster but with more stress; fewer interruptions reduce switching.", "ev": "Mark et al., 2008", "group": "env", "diff": 1, "tmin": 2, "tool": "guide", "quick": true, "multi": false}, {"id": "screenreview", "title": "Screen-time review", "mins": "10", "use": "you want to see where your phone time actually goes.", "steps": ["Open your phone’s screen-time report.", "Write down your top three apps and daily pickups.", "Choose one small limit for the coming week."], "why": "Monitoring behaviour makes change more likely, especially when it is written down.", "ev": "Harkin et al., 2016", "group": "env", "diff": 1, "tmin": 5, "tool": "write", "quick": true, "multi": false}, {"id": "deskreset", "title": "Two-minute desk reset", "mins": "2", "use": "before starting work or at the end of the day.", "steps": ["Clear everything not needed for the next task.", "Put out only what you need (notebook, water).", "Leave a sticky note with the first step."], "why": "Fewer visual cues to other tasks makes it easier to stay with one.", "ev": "Wood & Rünger, 2016", "group": "env", "diff": 1, "tmin": 2, "tool": "guide", "quick": true, "multi": false}, {"id": "socialbreak", "title": "Social media reduction week", "mins": "7 days", "use": "you want to test how much social media affects you.", "steps": ["Set a daily limit (e.g. 10 minutes per app).", "Keep it for one week.", "Rate focus and mood each day and compare."], "why": "Limiting social media use for three weeks improved well-being in one experiment; effects on attention are less studied.", "ev": "Hunt et al., 2018", "group": "env", "diff": 3, "tmin": 5, "tool": "guide", "quick": false, "multi": true}, {"id": "precommit", "title": "Precommit with a blocker", "mins": "5", "use": "you know you will be tempted later.", "steps": ["Install or turn on a site/app blocker or ‘focus mode’.", "Schedule it for your focus blocks.", "Make turning it off take effort."], "why": "People who set binding deadlines for themselves performed better than those with no deadlines in an experiment.", "ev": "Ariely & Wertenbroch, 2002", "group": "env", "diff": 1, "tmin": 5, "tool": "guide", "quick": true, "multi": false}, {"id": "sigh", "title": "Cyclic sighing", "mins": "5", "use": "you feel stressed and want a short breathing practice.", "steps": ["Breathe in through the nose, then take a second short sip of air on top.", "Breathe out slowly and fully through the mouth.", "Repeat for 5 minutes. Stop if you feel dizzy."], "why": "Five minutes of daily cyclic sighing improved mood and reduced breathing rate in a randomised study.", "ev": "Balban et al., 2023", "group": "body", "diff": 1, "tmin": 5, "tool": "breath:sigh", "quick": true, "multi": false}, {"id": "water", "title": "Water check", "mins": "1", "use": "you have been working for a while without a drink.", "steps": ["Drink a glass of water.", "Keep a bottle within reach.", "Notice whether it changes how you feel."], "why": "Even mild dehydration has been linked to worse mood and attention in some studies; the evidence is mixed but drinking water is low-risk.", "ev": "Masento et al., 2014", "group": "body", "diff": 1, "tmin": 1, "tool": "guide", "quick": true, "multi": false}, {"id": "caffeine", "title": "Caffeine cut-off", "mins": "1 week", "use": "you sleep poorly or feel wired at night.", "steps": ["Have your last caffeine at least six hours before bed for a week.", "Note sleep quality each morning.", "Compare with your usual week."], "why": "Caffeine taken even six hours before bed reduced sleep in a lab study.", "ev": "Drake et al., 2013", "group": "body", "diff": 2, "tmin": 1, "tool": "guide", "quick": false, "multi": true}, {"id": "nap", "title": "Short nap", "mins": "10–20", "use": "you are sleepy in the early afternoon.", "steps": ["Set an alarm for 10–20 minutes.", "Lie down somewhere quiet, even if you do not fall asleep.", "Get up straight away when the alarm sounds."], "why": "In a lab study after short sleep, a 10-minute nap gave the best balance of alertness and little grogginess.", "ev": "Brooks & Lack, 2006", "group": "body", "diff": 1, "tmin": 15, "tool": "timer", "quick": false, "multi": false}, {"id": "wake", "title": "Same wake-up time", "mins": "1 week", "use": "your sleep schedule changes a lot from day to day.", "steps": ["Choose a wake time you can keep on most days, weekends included.", "Get daylight soon after waking.", "Keep it for a week and note your energy."], "why": "Irregular sleep timing was linked with poorer academic performance in students.", "ev": "Phillips et al., 2017", "group": "body", "diff": 2, "tmin": 1, "tool": "guide", "quick": false, "multi": true}, {"id": "stretch", "title": "Micro-break stretch", "mins": "2–5", "use": "you have been sitting for over an hour.", "steps": ["Stand up and stretch arms, neck and back.", "Walk around for a minute.", "Return and restart with one clear next step."], "why": "Micro-breaks improved well-being in a meta-analysis, with smaller effects on performance.", "ev": "Albulescu et al., 2022", "group": "body", "diff": 1, "tmin": 3, "tool": "guide", "quick": true, "multi": false}, {"id": "schulte", "title": "Schulte table", "mins": "2–5", "use": "you want a quick visual search warm-up.", "steps": ["Use the app, or draw a 5×5 grid with numbers 1–25 in random order.", "Find and tap (or point to) the numbers in order as fast as you can.", "Record your time."], "why": "It trains fast visual search. Like other drills, improvements are mostly in the drill itself.", "ev": "Simons et al., 2016", "group": "drill", "diff": 1, "tmin": 3, "tool": "schulte", "quick": true, "multi": false}, {"id": "gonogo", "title": "Go/no-go", "mins": "3", "use": "you want to practise holding back an automatic response.", "steps": ["In the app: tap quickly for green, do not tap for red.", "Do one round of about 40 trials.", "Look at your misses and false taps, not only speed."], "why": "Go/no-go tasks measure response inhibition. Practice improves the task, with little evidence of broad transfer.", "ev": "Verbruggen & Logan, 2008; Simons et al., 2016", "group": "drill", "diff": 1, "tmin": 3, "tool": "gonogo", "quick": true, "multi": false}, {"id": "reaction", "title": "Reaction-time check", "mins": "2", "use": "you want to see how alert you are today.", "steps": ["In the app, tap as soon as the circle appears.", "Do one round.", "Compare with your usual times – slower times often follow short sleep."], "why": "Simple reaction-time tests are sensitive to sleep loss, which makes them a useful alertness check.", "ev": "Basner & Dinges, 2011", "group": "drill", "diff": 1, "tmin": 2, "tool": "reaction", "quick": true, "multi": false}, {"id": "digitspan", "title": "Backward digit span", "mins": "3", "use": "you want a short working-memory warm-up.", "steps": ["Ask someone to read 4 digits, or write and cover them.", "Say them back in reverse order.", "Add a digit each time you succeed."], "why": "Backward digit span loads working memory; it was the outcome measure in a nature-walk study. Training effects are mostly task-specific.", "ev": "Berman et al., 2008; Melby-Lervåg & Hulme, 2013", "group": "drill", "diff": 2, "tmin": 3, "tool": "guide", "quick": true, "multi": false}, {"id": "serial7", "title": "Serial sevens", "mins": "2", "use": "you want a short focus warm-up anywhere.", "steps": ["Count backwards from 100 in sevens: 93, 86, 79 …", "Go as far as you can without paper.", "Note where you lost track."], "why": "A quick mental-arithmetic task that requires keeping a running total in mind. Use it as a warm-up only.", "ev": "Simons et al., 2016", "group": "drill", "diff": 2, "tmin": 2, "tool": "guide", "quick": true, "multi": false}, {"id": "window", "title": "Green micro-break", "mins": "1", "use": "you have a minute between tasks.", "steps": ["Look out of a window at trees or greenery (or at a nature photo).", "Rest your eyes there for 40–60 seconds.", "Return to your task."], "why": "In one study, a 40-second view of a green roof led to better sustained attention than a concrete roof view.", "ev": "Lee et al., 2015", "group": "recover", "diff": 1, "tmin": 1, "tool": "guide", "quick": true, "multi": false}, {"id": "naturesounds", "title": "Nature sounds break", "mins": "5", "use": "you cannot get outside.", "steps": ["Play a recording of nature sounds (birds, water, wind).", "Close your eyes and listen for 5 minutes.", "Notice how you feel before returning."], "why": "Listening to nature sounds improved performance on an attention task compared with urban sounds in one study.", "ev": "Van Hedger et al., 2019", "group": "recover", "diff": 1, "tmin": 5, "tool": "guide", "quick": true, "multi": false}, {"id": "screenfree", "title": "Screen-free break", "mins": "5–10", "use": "your breaks are spent scrolling.", "steps": ["Leave all screens behind for your break.", "Walk, stretch, look outside or make a drink.", "Return when the timer ends."], "why": "Breaks help most when they are a real change from work; scrolling keeps attention busy.", "ev": "Albulescu et al., 2022", "group": "recover", "diff": 1, "tmin": 5, "tool": "timer", "quick": true, "multi": false}, {"id": "donothing", "title": "Three minutes of nothing", "mins": "3", "use": "you feel overloaded.", "steps": ["Sit and do nothing for three minutes – no phone, no task.", "Let your mind wander freely.", "Notice whether you feel more settled afterwards."], "why": "Short, undemanding rest gives effortful attention a break; this is a simple experiment rather than a tested technique.", "ev": "Self-experiment", "group": "recover", "diff": 1, "tmin": 3, "tool": "timer", "quick": true, "multi": false}, {"id": "bodydouble", "title": "Body doubling", "mins": "15–25", "use": "starting or staying on a boring task is hard alone.", "steps": ["Work alongside another person (in person or on video), each on your own task.", "Say out loud what you will do; check in at the end.", "In the app, the timer shows a calm ‘working together’ screen if no one is available."], "why": "Many people with ADHD find it helpful, but there is very little research on body doubling yet. Try it and keep it if it works for you.", "ev": "Practice-based; little research", "group": "adhd", "diff": 1, "tmin": 15, "tool": "double", "quick": false, "multi": false}, {"id": "twomin", "title": "Two-minute start", "mins": "2", "use": "you are avoiding a task.", "steps": ["Decide to do only two minutes of it.", "Set a two-minute timer and start with the easiest piece.", "When it rings, you may stop – or keep going."], "why": "Starting is often the hardest part. Breaking tasks down and starting small are common parts of CBT programmes for adult ADHD.", "ev": "Safren et al., 2010; Solanto et al., 2010", "group": "adhd", "diff": 1, "tmin": 2, "tool": "timer", "quick": true, "multi": false}, {"id": "chunk", "title": "Task chunking", "mins": "5", "use": "a task feels too big to start.", "steps": ["Write the big task at the top.", "Break it into steps that take 5–15 minutes each.", "Do only the first step now."], "why": "Breaking tasks into small, concrete steps is a core skill in CBT-based programmes for adults with ADHD.", "ev": "Safren et al., 2010; Solanto et al., 2010", "group": "adhd", "diff": 1, "tmin": 5, "tool": "chunk", "quick": true, "multi": false}, {"id": "nextstep", "title": "Next tiny step", "mins": "1", "use": "you feel stuck or overwhelmed.", "steps": ["Ask: ‘What is the next tiny physical action?’ (e.g. ‘open the document’).", "Write it in a few words.", "Do it now."], "why": "A concrete, physical next action is easier to start than a vague goal; it works like a mini if-then plan.", "ev": "Gollwitzer & Sheeran, 2006", "group": "adhd", "diff": 1, "tmin": 1, "tool": "next", "quick": true, "multi": false}, {"id": "vistimer", "title": "Visual timer", "mins": "5–25", "use": "you lose track of time.", "steps": ["Start a visual timer (in the app, the colour ring shrinks as time passes).", "Keep it in view while you work.", "When it ends, stop and choose the next step."], "why": "Difficulties with sensing time are described in ADHD research; making time visible is a widely used, low-risk support, though direct trials are few.", "ev": "Barkley, 1997; practice-based", "group": "adhd", "diff": 1, "tmin": 5, "tool": "timer", "quick": true, "multi": false}, {"id": "braindump", "title": "External brain dump", "mins": "5", "use": "your head is full of to-dos and worries.", "steps": ["Write everything on your mind, in any order, for 5 minutes.", "Circle what needs action and give it a time.", "Close the list – it is safe on paper or in the app."], "why": "Making a plan for unfinished tasks reduced their intrusion into later work in experiments.", "ev": "Masicampo & Baumeister, 2011", "group": "adhd", "diff": 1, "tmin": 5, "tool": "dump", "quick": true, "multi": false}, {"id": "transition", "title": "Transition ritual", "mins": "2", "use": "switching between tasks or from break back to work is hard.", "steps": ["Close what you were doing and write one line on where you stopped.", "Take one slow breath and stand up or stretch.", "Name the next task out loud and open only what it needs."], "why": "Writing where you stopped and clearly starting the next task may reduce attention residue; evidence is indirect.", "ev": "Leroy, 2009", "group": "adhd", "diff": 1, "tmin": 2, "tool": "guide", "quick": true, "multi": false}], "groups": [["attn", "Attention & mindfulness"], ["deep", "Single-tasking & deep work"], ["plan", "Planning & if-then"], ["env", "Environment & digital"], ["body", "Body: movement, sleep & breath"], ["drill", "Cognitive drills"], ["recover", "Recovery & nature"], ["adhd", "ADHD-friendly strategies"]], "days": [{"ex": null, "title": "Your baseline", "steps": ["Take the focus baseline quiz (Day 1 column).", "Start the distraction audit log and keep it today and tomorrow.", "Circle your hardest time of day."], "why": "You cannot change what you do not see. Writing things down makes patterns visible and supports change.", "special": "quiz"}, {"ex": "anchor", "title": "Anchor your attention", "steps": ["Do 5 minutes of attention-anchor breathing.", "Count drifts with tally marks in the notes box.", "Continue the audit log."], "why": "Each time you notice drifting and return, you practise the core skill of focus.", "special": null}, {"ex": "parking", "title": "Park it, don’t chase it", "steps": ["Keep a parking lot beside you for one work session.", "Write every intruding thought or to-do, then return.", "Process the list at the end."], "why": "Writing a thought down with a plan helps it stop tugging at your attention.", "special": null}, {"ex": "mwcheck", "title": "Catch the wandering mind", "steps": ["Set 5 reminders today.", "At each one, note: on task or off? Where was my mind?", "Look for patterns tonight."], "why": "Mind-wandering is normal and common; noticing it is the first step to returning.", "special": null}, {"ex": "sprint", "title": "Your first sprints", "steps": ["Do two single-task sprints of 15–25 minutes.", "One task per sprint, with a clear ‘done for now’.", "Take a real break between them."], "why": "Time-boxing a single task reduces switching, which costs time and accuracy.", "special": null}, {"ex": "ground", "title": "Reset with the senses", "steps": ["Use 5-4-3-2-1 grounding once when you feel scattered.", "Take a 10-minute mindful walk.", "Note how you feel before and after."], "why": "Shifting attention to the senses is a quick way to step out of a busy mind.", "special": null}, {"ex": "weekly", "title": "Week 1 review", "steps": ["Complete the weekly review page.", "Re-read your audit log and quiz.", "Write one if-then plan for week 2."], "why": "Reviewing progress in writing increases the chance of reaching a goal.", "special": "review"}, {"ex": "ifthen", "title": "Plan for your distractions", "steps": ["Write if-then plans for your top three distractions.", "Read them aloud this morning.", "Tick each time you used one."], "why": "Specific if-then plans have strong research support for turning intentions into action.", "special": null}, {"ex": "sprint", "title": "One task, one sprint", "steps": ["Do three sprints today, each on a single task.", "Before each sprint, write the task in one line.", "Rate focus after each one."], "why": "Clear goals plus protected time make it easier to stay with one thing.", "special": null}, {"ex": "onetab", "title": "The one-tab morning", "steps": ["Work with one tab or window at a time until lunch.", "Write new ideas in the parking lot instead of opening tabs.", "Notice the urge to switch."], "why": "Fewer open options means fewer cues to switch and less attention residue.", "special": null}, {"ex": "stroop", "title": "Stroop warm-up", "steps": ["Do the Stroop drill (blocks A and B) and note your times.", "Then start your most important task straight away.", "Notice the effort of overriding a habit."], "why": "The drill makes the effort of inhibiting a habit visible. Treat it as a warm-up, not a brain upgrade.", "special": null}, {"ex": "read", "title": "Deep reading", "steps": ["Read for 20 minutes without switching.", "Mark the margin each time you drift.", "Write three key points from memory."], "why": "Reading without switching avoids the costs of jumping between tasks.", "special": null}, {"ex": "matrix", "title": "Choose what matters", "steps": ["Sort today’s tasks in the priority matrix.", "Pick one top priority and schedule it.", "Drop or delegate one thing."], "why": "Deciding in advance means less in-the-moment deciding and more attention for the task.", "special": null}, {"ex": "weekly", "title": "Week 2 review", "steps": ["Complete the weekly review page.", "Which single-tasking tool helped most?", "Write one if-then plan for week 3."], "why": "Reviewing progress in writing increases the chance of reaching a goal.", "special": "review"}, {"ex": "phone", "title": "Phone in another room", "steps": ["Do one 60-minute session with your phone in another room.", "Do a similar session with the phone on the desk (another time or tomorrow).", "Compare ratings."], "why": "Research on phone presence is mixed – your own comparison tells you what matters for you.", "special": null}, {"ex": "env", "title": "Design your space", "steps": ["Go through the environment checklist.", "Change three things today.", "Take a ‘before’ and ‘after’ look at your desk."], "why": "Habits are cued by our surroundings; changing cues is easier than resisting them.", "special": null}, {"ex": "notif", "title": "Quiet the pings", "steps": ["Turn off all non-essential notifications.", "Choose 2–3 times to check email and messages.", "Stick to them today."], "why": "Checking email less often reduced daily stress in a field experiment.", "special": null}, {"ex": "deep", "title": "Your first deep-work block", "steps": ["Plan and protect one 60–90 minute block.", "Define the outcome before you start.", "Record what you produced."], "why": "Protected time lets you think without the costs of constant interruption.", "special": null}, {"ex": "nback", "title": "Working-memory warm-up", "steps": ["Do the 1-back rows, then try one 2-back row.", "Check with the answer key.", "Then start a focused task."], "why": "n-back drills load working memory; use them as a focused warm-up, not as a guarantee of broad gains.", "special": null}, {"ex": "sunset", "title": "Digital ls", "icon": "💳", "steps": [["Open the banking app and gather the bills in one spot.", 3], ["Pay the most urgent (or smallest) one first.", 3], ["Pay the next one.", 3], ["Note what’s paid; file or recycle the paper.", 3], ["Set up autopay or a calendar reminder for next time.", 4]], "tips": ["Autopay for fixed bills removes the task for good.", "One ‘bills’ tray or folder – post goes there, not on the table.", "Put a monthly ‘bills’ reminder in your calendar.", "Do them in one sitting with a 10-minute timer."]}, {"id": "email", "icon": "📞", "steps": [["Write one sentence: what do I need from this email or call?", 2], ["Open only that email, or find the number – nothing else.", 2], ["Write a short draft or say it out loud once (2-minute start).", 3], ["Send it or make the call.", 3], ["Write down any next step.", 2]], "tips": ["Short is fine – three sentences beat a perfect email never sent.", "For calls, use a mini script: who you are, what you need, one question.", "Do it before checking other messages.", "Body doubling helps: have someone nearby while you call."]}, {"id": "cook", "icon": "🍳", "steps": [["Empty the dishwasher first, so you can clean as you go.", 4], ["Pick a simple meal and get all the ingredients out.", 3], ["Prep: wash and chop.", 5], ["Start cooking – set a timer for anything in the pan or oven.", 5], ["Wipe the counter and load dishes while it cooks.", 4], ["Serve and enjoy. Leftovers into a box and the fridge.", 3]], "tips": ["Empty the dishwasher before you start.", "Wipe while it cooks – much less to clean afterwards.", "Keep 3–5 ‘default dinners’ you can make without thinking.", "Set a timer for the oven – don’t trust memory."]}, {"id": "kids", "icon": "🎒", "steps": [["Check today’s needs: school bag, forms, snacks, sports kit.", 3], ["Pack the bags and put them by the door.", 4], ["Sign forms and reply to school messages.", 3], ["Lay out tomorrow’s clothes.", 3], ["Add new dates to the family calendar.", 3]], "tips": ["A ‘launch pad’ by the door: bags, shoes and keys always live there.", "Pack in the evening, not in the morning rush.", "One shared family calendar on the fridge or phone.", "A small checklist on the door helps kids (and you) remember."]}, {"id": "selfcare", "icon": "🚿", "steps": [["Put on music; gather towel and clean clothes.", 2], ["Shower – a 2–3 song playlist is your timer.", 5], ["Teeth, skin, and medication if you take it.", 3], ["Towel and clothes back in their place.", 2]], "tips": ["Self-care is a task too – it counts.", "Keep everything in one caddy so starting is easy.", "Pair it with something you enjoy (music, a nice soap).", "Lay out clothes first so you don’t get stuck afterwards."]}], "generic": {"id": "custom", "icon": "✨", "steps": [["Gather what you need.", 2], ["Start with the smallest bit (2-minute start).", 2], ["Work with a 10-minute timer.", 10], ["Finish and put things away.", 3]], "tips": ["The 2-minute start: you only promise to begin. Stopping after 2 minutes is allowed.", "Make the next step tiny and visible – write it down.", "A visual timer makes time easier to feel.", "Done is better than perfect."]}, "routines": [{"id": "morning", "mins": 10, "icon": "🌅", "steps": ["Open the curtains and drink a glass of water", "Make the bed – good enough", "Medication if you take it", "Last night’s dishes into the dishwasher", "Check the calendar: what is today’s one important thing?", "Bag, keys and phone on the launch pad by the door"]}, {"id": "evening", "mins": 15, "icon": "🌙", "steps": ["Kitchen: dishes in, wipe the counter", "Drop-zone basket: put things back where they live", "Reset one hotspot (table, chair or counter)", "Lay out clothes and pack bags for tomorrow", "Write tomorrow’s top 3 – or one tiny next step", "Phone on charge outside the bedroom"]}], "projects": [{"id": "sell", "icon": "🏡", "months": 5, "en": "Sell a house", "lt": "Parduoti namą", "phases": [{"en": "Decide & get ready", "lt": "Sprendimas ir pasiruošimas", "w": 4.0, "steps": [{"en": "Pick your ideal move-out date and write it down", "lt": "Pasirink norimą išsikraustymo datą ir užsirašyk", "tip": ["Work backwards: closing usually takes 30–45 days after you accept an offer.", "Skaičiuok atgal: sandoris paprastai užtrunka 30–45 d. nuo pasiūlymo priėmimo."], "sub": [["Note any fixed dates (school, new job, lease end)", "Užsirašyk fiksuotas datas (mokykla, naujas darbas, nuomos pabaiga)"], ["Put the target month in your calendar", "Įrašyk tikslinį mėnesį į kalendorių"], ["Tell the people who need to know", "Pasakyk tiems, kam reikia žinoti"]]}, {"en": "Find your numbers: payoff and selling costs", "lt": "Sužinok skaičius: paskolos likutis ir pardavimo kaštai", "tip": ["Budget roughly 6–10% of the price for commission, closing costs and small repairs (it varies by state).", "Numatyk apie 6–10 % kainos komisiniams, sandorio mokesčiams ir smulkiam remontui (priklauso nuo valstijos)."], "sub": [["Ask your lender for a payoff statement", "Paprašyk banko paskolos likučio pažymos"], ["List the estimated costs on one page", "Surašyk numatomus kaštus viename lape"], ["Rough net = price − payoff − costs", "Apytikslis likutis = kaina − paskola − kaštai"]]}, {"en": "Declutter one room (start with the living room)", "lt": "Iškraustyk vieną kambarį (pradėk nuo svetainės)", "tip": ["Three boxes: keep, donate, toss. Set a 20-minute timer – buyers need to picture their own things.", "Trys dėžės: palikti, atiduoti, išmesti. 20 min laikmatis – pirkėjai turi įsivaizduoti savo daiktus."], "sub": [["Clear surfaces down to 2–3 items", "Ant paviršių palik 2–3 daiktus"], ["Pack away personal photos", "Supakuok asmenines nuotraukas"], ["Take the donate box to the car", "Nunešk atiduodamų daiktų dėžę į mašiną"]]}, {"en": "Declutter the rest, one room per session", "lt": "Iškraustyk likusius kambarius – po vieną per kartą", "tip": ["Closets and cabinets get opened at showings – aim for half-full.", "Apžiūrų metu atidaro spintas – tegul jos būna pustuštės."], "sub": [["Kitchen counters nearly empty", "Virtuvės stalviršiai beveik tušti"], ["Closets half-full", "Spintos pustuštės"], ["Book a donation pick-up or storage unit", "Užsisakyk labdaros paėmimą arba sandėliuką"]]}]}, {"en": "Repairs & fresh look", "lt": "Remontas ir išvaizda", "w": 3.0, "steps": [{"en": "Walk through with \"buyer’s eyes\" and make a fix list", "lt": "Apeik namus „pirkėjo akimis“ ir sudaryk taisymų sąrašą", "tip": ["Start outside at the curb, then go room by room. Write everything; decide later.", "Pradėk nuo gatvės, tada kambarys po kambario. Rašyk viską, rūšiuosi vėliau."], "sub": [["Note drips, bulbs, sticky doors, cracks", "Užsirašyk lašančius čiaupus, lemputes, strigančias duris, įtrūkimus"], ["Mark each item: DIY or pro", "Pažymėk: pats ar meistras"], ["Circle the 5 that buyers will notice most", "Apibrauk 5, kuriuos pirkėjai pastebės labiausiai"]]}, {"en": "Fix the small stuff (drips, bulbs, caulk, handles)", "lt": "Sutaisyk smulkmenas (čiaupai, lemputės, silikonas, rankenos)", "tip": ["Small visible fixes beat big renovations – most buyers won’t pay back a remodel.", "Smulkūs matomi pataisymai naudingesni už didelį remontą – jis retai atsiperka."], "sub": [["Replace dead bulbs (same colour in each room)", "Pakeisk perdegusias lemputes (vienos spalvos kambaryje)"], ["Re-caulk tub and sink if stained", "Atnaujink silikoną prie vonios ir kriauklės"], ["Book a handyman for the rest", "Likusiems darbams užsisakyk meistrą"]]}, {"en": "Fresh paint in neutral colours where needed", "lt": "Kur reikia – perdažyk neutraliomis spalvomis", "tip": ["Soft whites and light greige photograph well and feel move-in ready.", "Švelni balta ir šviesi pilkai smėlinė gerai atrodo nuotraukose."], "sub": [["Pick one neutral colour for most rooms", "Pasirink vieną neutralią spalvą daugumai kambarių"], ["Touch up scuffs on doors and trim", "Užtaisyk nubrozdinimus ant durų ir apvadų"]]}, {"en": "Boost curb appeal: front door, lawn, entry", "lt": "Pagerink pirmą įspūdį: lauko durys, veja, įėjimas", "tip": ["Buyers decide a lot in the first 10 seconds – and it’s the main listing photo.", "Pirkėjai daug nusprendžia per pirmas 10 sekundžių – ir tai pagrindinė skelbimo nuotrauka."], "sub": [["Mow, edge and weed", "Nupjauk žolę, nuravėk"], ["Clean or paint the front door; new doormat", "Nuvalyk arba nudažyk duris, naujas kilimėlis"], ["Add one potted plant by the door", "Prie durų pastatyk vazoną"]]}]}, {"en": "Agent & price", "lt": "Agentas ir kaina", "w": 3.0, "steps": [{"en": "Interview 2–3 listing agents", "lt": "Pakalbink 2–3 nekilnojamojo turto agentus", "tip": ["Ask each: recent sales near you, marketing plan, commission, contract length. Everything is negotiable.", "Paklausk: neseni pardavimai šalia, rinkodaros planas, komisiniai, sutarties trukmė. Viskas derinama."], "sub": [["Ask neighbours or friends for names", "Paklausk kaimynų ar draugų rekomendacijų"], ["Book 3 short calls or visits", "Susitark dėl 3 trumpų pokalbių ar vizitų"], ["Write their answers side by side", "Surašyk atsakymus greta vienas kito"]]}, {"en": "Choose your agent and sign the listing agreement", "lt": "Pasirink agentą ir pasirašyk sutartį", "tip": ["Read the end date and cancellation terms before signing.", "Prieš pasirašydamas perskaityk pabaigos datą ir nutraukimo sąlygas."], "sub": [["Confirm commission and who pays what", "Patikslink komisinius ir kas ką apmoka"], ["Agree on the listing date", "Sutarkite dėl skelbimo datos"]]}, {"en": "Review comps and set the price", "lt": "Peržiūrėk palyginamus pardavimus ir nustatyk kainą", "tip": ["Look at SOLD (not listed) homes nearby from the last 3–6 months with similar size, beds and baths. The right price on day one matters most.", "Žiūrėk PARDUOTUS (ne skelbiamus) panašaus dydžio namus šalia per 3–6 mėn. Tinkama kaina nuo pirmos dienos svarbiausia."], "sub": [["Ask your agent for a comparative market analysis (CMA)", "Paprašyk agento rinkos palyginimo analizės (CMA)"], ["Pick 3 comps that are most like your home", "Išsirink 3 labiausiai panašius"], ["Decide your list price and your lowest OK price", "Nuspręsk skelbiamą kainą ir žemiausią priimtiną"]]}, {"en": "Fill in the seller disclosure form", "lt": "Užpildyk pardavėjo informacijos (disclosure) formą", "tip": ["Be honest about known issues – it protects you later. Your agent has the state form.", "Būk sąžiningas dėl žinomų problemų – tai apsaugo vėliau. Agentas turi valstijos formą."], "sub": [["Gather repair receipts and warranties", "Surink remonto kvitus ir garantijas"], ["Note roof, HVAC and water-heater ages", "Užsirašyk stogo, šildymo ir boilerio amžių"]]}]}, {"en": "Stage, photos & listing", "lt": "Paruošimas, nuotraukos ir skelbimas", "w": 3.0, "steps": [{"en": "Deep clean (or book cleaners)", "lt": "Generalinis valymas (arba užsisakyk valytojus)", "tip": ["Windows, baseboards, grout and appliances are what buyers notice.", "Langai, grindjuostės, plytelių siūlės ir buitinė technika – tai, ką pastebi pirkėjai."], "sub": [["Kitchen and bathrooms first", "Pirmiausia virtuvė ir vonios"], ["Wash windows inside and out", "Nuplauk langus iš abiejų pusių"]]}, {"en": "Stage the main rooms", "lt": "Paruošk pagrindinius kambarius apžiūrai", "tip": ["Less furniture, more light. Each room should have one clear purpose.", "Mažiau baldų, daugiau šviesos. Kiekvienas kambarys – viena aiški paskirtis."], "sub": [["Remove one piece of furniture per room", "Iš kiekvieno kambario išnešk vieną baldą"], ["Open curtains, turn on all lights", "Atitrauk užuolaidas, įjunk visas šviesas"], ["Fresh towels and a simple bedspread", "Švieži rankšluosčiai ir paprasta lovatiesė"]]}, {"en": "Photo day (professional photos)", "lt": "Fotografavimo diena (profesionalios nuotraukos)", "tip": ["Most agents arrange this. Hide cars, bins, cables and fridge magnets.", "Dažniausiai organizuoja agentas. Paslėpk mašinas, šiukšliadėžes, laidus ir magnetukus."], "sub": [["Confirm the date and time with your agent", "Patikslink datą ir laiką su agentu"], ["Do a 15-minute tidy right before", "15 min susitvarkymas prieš pat fotografavimą"]]}, {"en": "Approve the listing and go live", "lt": "Patvirtink skelbimą ir paskelbk", "tip": ["Check the details: rooms, square footage, school names, HOA fees.", "Patikrink: kambariai, plotas, mokyklos, bendrijos mokesčiai."], "sub": [["Read the description out loud once", "Vieną kartą perskaityk aprašymą garsiai"], ["Pick your favourite main photo", "Išsirink mėgstamiausią pagrindinę nuotrauką"]]}]}, {"en": "Showings & offers", "lt": "Apžiūros ir pasiūlymai", "w": 4.0, "steps": [{"en": "Make a 15-minute showing kit", "lt": "Pasidaryk 15 minučių „apžiūros rinkinį“", "tip": ["A basket for last-minute clutter, wipes, a lint roller and air freshener – grab it and go.", "Krepšys netvarkai, servetėlės, pūkų volelis ir gaiviklis – griebi ir eini."], "sub": [["Basket for clutter (it rides in your car)", "Krepšys netvarkai (keliauja į mašiną)"], ["Checklist taped inside a cabinet", "Sąrašas, priklijuotas spintelės viduje"]]}, {"en": "Plan where you’ll go during showings", "lt": "Suplanuok, kur būsi apžiūrų metu", "tip": ["Buyers relax when sellers aren’t home. Plan for pets too.", "Pirkėjai jaučiasi laisviau, kai pardavėjų nėra namie. Pagalvok ir apie gyvūnus."], "sub": [["Pick 2 nearby places to wait", "Išsirink 2 vietas netoliese palaukti"], ["Pet plan (crate, walk or friend)", "Gyvūnų planas (narvelis, pasivaikščiojimas ar draugas)"]]}, {"en": "Review offers with your agent", "lt": "Peržiūrėk pasiūlymus su agentu", "tip": ["Price isn’t everything: compare financing, contingencies, earnest money and closing date.", "Kaina – ne viskas: palygink finansavimą, sąlygas, rankpinigius ir sandorio datą."], "sub": [["Ask for a side-by-side summary", "Paprašyk palyginimo lentelės"], ["Decide: accept, counter or wait", "Nuspręsk: priimti, siūlyti kitą kainą ar laukti"]]}, {"en": "Accept an offer and sign the purchase agreement", "lt": "Priimk pasiūlymą ir pasirašyk pirkimo sutartį", "tip": ["Put every deadline (inspection, appraisal, closing) into your calendar right away.", "Iš karto įsirašyk visus terminus (apžiūra, vertinimas, sandoris) į kalendorių."], "sub": [["Save the signed contract in one folder", "Pasirašytą sutartį laikyk viename aplanke"], ["Write the key dates on one page", "Svarbiausias datas surašyk viename lape"]]}]}, {"en": "Under contract → closing & move", "lt": "Sutartis → sandoris ir persikraustymas", "w": 6.0, "steps": [{"en": "Buyer’s inspection: be ready for repair requests", "lt": "Pirkėjo apžiūra: būk pasiruošęs prašymams pataisyti", "tip": ["Requests are normal. Decide with your agent: fix, give a credit, or say no.", "Prašymai – įprasta. Su agentu nuspręsk: taisyti, duoti nuolaidą ar atsisakyti."], "sub": [["Leave the house open and easy to access", "Palik namus lengvai pasiekiamus"], ["Get 1–2 quotes for anything big", "Didesniems darbams gauk 1–2 pasiūlymus"]]}, {"en": "Appraisal (the buyer’s lender orders it)", "lt": "Vertinimas (užsako pirkėjo bankas)", "tip": ["If it comes in low: renegotiate, the buyer covers the gap, or challenge it with comps.", "Jei vertė mažesnė: deratis, pirkėjas padengia skirtumą arba ginčyti su palyginimais."], "sub": [["Leave your repair list out for the appraiser", "Palik vertintojui atliktų darbų sąrašą"]]}, {"en": "Book movers or a truck", "lt": "Užsisakyk perkraustymą arba sunkvežimį", "tip": ["Book 4–6 weeks ahead, especially at month-end and in summer.", "Užsakyk prieš 4–6 savaites, ypač mėnesio pabaigai ir vasarai."], "sub": [["Get 2–3 quotes", "Gauk 2–3 pasiūlymus"], ["Pick the moving day (a day before closing is calm)", "Pasirink dieną (diena prieš sandorį – ramiausia)"]]}, {"en": "Change of address and utilities", "lt": "Adreso keitimas ir komunalinės paslaugos", "tip": ["USPS change of address online; schedule utilities to stop the day after closing.", "USPS adreso keitimas internetu; komunalines paslaugas sustabdyk dieną po sandorio."], "sub": [["Mail forwarding", "Pašto peradresavimas"], ["Electric, gas, water, internet", "Elektra, dujos, vanduo, internetas"], ["Bank, insurance, employer", "Bankas, draudimas, darbdavys"]]}, {"en": "Pack one room per session, label by room", "lt": "Pakuok po vieną kambarį, žymėk pagal kambarį", "tip": ["Pack an \"open first\" box: chargers, meds, toiletries, kettle, sheets.", "Supakuok dėžę „atidaryti pirmą“: įkrovikliai, vaistai, higiena, virdulys, patalynė."], "sub": [["Start with rooms you use least", "Pradėk nuo mažiausiai naudojamų kambarių"], ["Room name + top 3 items on each box", "Ant dėžės – kambarys ir 3 svarbiausi daiktai"]]}, {"en": "Respond to title/escrow paperwork quickly", "lt": "Greitai atsakyk į sandorio dokumentų prašymus", "tip": ["Delays usually come from missing documents. A 5-minute reply today saves a week.", "Vėlavimai dažnai kyla dėl trūkstamų dokumentų. 5 min šiandien sutaupo savaitę."], "sub": [["Keep ID and documents in one folder", "Asmens dokumentus ir popierius laikyk viename aplanke"], ["Confirm how and when you’ll get the money", "Patikslink, kaip ir kada gausi pinigus"]]}, {"en": "Final walk-through prep and closing day", "lt": "Paskutinė apžiūra ir sandorio diena", "tip": ["Leave keys, garage remotes and manuals in a kitchen drawer. Then celebrate!", "Raktus, garažo pultelius ir instrukcijas palik virtuvės stalčiuje. Tada švęsk!"], "sub": [["Leave the house broom-clean", "Palik namus išvalytus"], ["Sign, hand over keys", "Pasirašyk, perduok raktus"], ["Celebrate – you sold a house! 🎉", "Švęsk – pardavei namą! 🎉"]]}]}]}, {"id": "move", "icon": "📦", "months": 2, "en": "Move home", "lt": "Persikraustyti", "phases": [{"en": "Plan", "lt": "Planas", "w": 3.0, "steps": [{"en": "Pick the moving date and write it down", "lt": "Pasirink persikraustymo datą ir užsirašyk", "tip": ["Mid-month and mid-week moves are usually cheaper and calmer.", "Mėnesio ir savaitės viduryje dažniausiai pigiau ir ramiau."], "sub": [["Check lease or closing dates", "Pasitikrink nuomos ar sandorio datas"], ["Ask for the day off work", "Paprašyk laisvos dienos darbe"]]}, {"en": "Decide: movers, truck or friends", "lt": "Nuspręsk: perkraustytojai, sunkvežimis ar draugai", "tip": ["Get 2–3 quotes. Ask what’s included (packing, stairs, insurance).", "Gauk 2–3 pasiūlymus. Paklausk, kas įeina (pakavimas, laiptai, draudimas)."], "sub": [["Get quotes", "Gauk pasiūlymus"], ["Book and save the confirmation", "Užsakyk ir išsaugok patvirtinimą"]]}, {"en": "Make a moving folder (paper or phone)", "lt": "Pasidaryk persikraustymo aplanką (popierinį ar telefone)", "tip": ["One place for contracts, quotes, receipts and the to-do list – less hunting later.", "Viena vieta sutartims, pasiūlymams, kvitams ir sąrašui – mažiau ieškojimo."], "sub": [["Create the folder", "Sukurk aplanką"], ["Add the key dates", "Įrašyk svarbiausias datas"]]}]}, {"en": "Sort & pack", "lt": "Rūšiavimas ir pakavimas", "w": 5.0, "steps": [{"en": "Sort one room: keep, donate, sell, toss", "lt": "Išrūšiuok vieną kambarį: palikti, atiduoti, parduoti, išmesti", "tip": ["Don’t pay to move things you don’t love or use.", "Nemokėk už daiktų, kurių nemėgsti ir nenaudoji, pervežimą."], "sub": [["20-minute timer", "20 min laikmatis"], ["Donate box to the car", "Atiduodamų daiktų dėžę – į mašiną"]]}, {"en": "Get boxes, tape and markers", "lt": "Pasirūpink dėžėmis, juosta ir žymekliais", "tip": ["Ask local shops or neighbourhood groups for free boxes.", "Paklausk parduotuvių ar kaimynų grupėse nemokamų dėžių."], "sub": [["About 10 boxes per room as a guess", "Apytiksliai 10 dėžių kambariui"]]}, {"en": "Pack rooms you use least (books, decor, guest room)", "lt": "Supakuok mažiausiai naudojamus kambarius (knygos, dekoras, svečių kambarys)", "tip": ["Heavy things in small boxes, light things in big boxes.", "Sunkius daiktus – į mažas dėžes, lengvus – į dideles."], "sub": [["One room per session", "Vienas kambarys per kartą"], ["Label: room + top 3 items", "Žymėk: kambarys + 3 svarbiausi daiktai"]]}, {"en": "Pack the kitchen (leave a small \"last week\" ": "Surašyk visas sąskaitas viename lape", "tip": ["Bank, cards, loans, retirement, subscriptions. Names only – no passwords here.", "Bankai, kortelės, paskolos, pensija, prenumeratos. Tik pavadinimai – jokių slaptažodžių."], "sub": [["Banks and cards", "Bankai ir kortelės"], ["Loans and bills", "Paskolos ir sąskaitos"]]}, {"en": "Collect tax documents", "lt": "Surink mokesčių dokumentus", "tip": ["US: W-2s and 1099s arrive by end of January; keep receipts for deductions.", "JAV: W-2 ir 1099 ateina iki sausio pabaigos; laikyk kvitus atskaitymams."], "sub": [["Income forms", "Pajamų formos"], ["Receipts and donations", "Kvitai ir aukos"]]}]}, {"en": "Understand", "lt": "Supratimas", "w": 3.0, "steps": [{"en": "Look at last month’s spending (20 minutes)", "lt": "Peržiūrėk praėjusio mėnesio išlaidas (20 min)", "tip": ["Just look – no judging. Group into needs, wants, savings.", "Tik pažiūrėk – be vertinimo. Sugrupuok: būtina, norima, taupymas."], "sub": [["Download one statement", "Atsisiųsk vieną išrašą"], ["Mark the 3 biggest surprises", "Pažymėk 3 didžiausias staigmenas"]]}, {"en": "Cancel 1–3 subscriptions you don’t use", "lt": "Atšauk 1–3 nenaudojamas prenumeratas", "tip": ["Search your statement for small repeating charges.", "Išraše ieškok mažų pasikartojančių mokėjimų."], "sub": [["Cancel one now", "Atšauk vieną dabar"]]}, {"en": "Set a simple monthly plan", "lt": "Susidaryk paprastą mėnesio planą", "tip": ["A rough split (e.g. needs / wants / savings) is enough – perfect budgets don’t stick.", "Užtenka apytikslio padalijimo (būtina / norima / taupymas) – tobuli biudžetai neprigyja."], "sub": [["Write three numbers", "Užrašyk tris skaičius"]]}]}, {"en": "Automate", "lt": "Automatizavimas", "w": 2.0, "steps": [{"en": "Turn on autopay for fixed bills", "lt": "Įjunk automatinį fiksuotų sąskaitų mokėjimą", "tip": ["Fewer due dates to remember = fewer late fees.", "Mažiau datų atsiminti = mažiau delspinigių."], "sub": [["Pick the bills", "Pasirink sąskaitas"]]}, {"e
