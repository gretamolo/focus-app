  A.querySelectorAll("#budget button").forEach(b => b.onclick = () => { S.budget = +b.dataset.v; rebuildSet(); save(); render(); });
  A.querySelectorAll("#lang button").forEach(b => b.onclick = () => { S.lang = b.dataset.v; save(); render(); });
  const ms = $("#msel"); if (ms) ms.onchange = () => { S.cur = +ms.value; save(); render(); };
  [$("#newmonth"), $("#newmonth2")].forEach(b => b && (b.onclick = () => { if (confirm(t("new_month_q"))) { S.months.push(genMonth(S.budget)); S.cur = S.months.length - 1; save(); view = "plan"; render(); } }));
  A.querySelectorAll("[data-revsave]").forEach(b => b.onclick = () => { const k = b.dataset.revsave; S.reviews[k] = [...A.querySelectorAll(`[data-rev="${k}"]`)].map(x => x.value); save(); toast(t("saved")); });
  A.querySelectorAll("[data-grp]").forEach(b => b.onclick = () => { exFilter = b.dataset.grp; render(); });
  const es = $("#exs"); if (es) es.oninput = () => { exSearch = es.value; const pos = es.selectionStart; render(); const n = $("#exs"); n.focus(); n.setSelectionRange(pos, pos); };
  A.querySelectorAll("[data-pd]").forEach(b => b.onclick = () => { progDrill = b.dataset.pd; render(); });
  A.querySelectorAll("[data-quiz]").forEach(b => b.onclick = () => runQuiz(b.dataset.quiz, null));
  A.querySelectorAll("[data-rt]").forEach(inp => inp.onchange = () => { S.rtimes[inp.dataset.rt] = inp.value || S.rtimes[inp.dataset.rt]; save(); });
  const ic = $("#ics"); if (ic) ic.onclick = () => download("focus-daily-reminders.ics", icsText(), "text/calendar");
  const nb = $("#notif"); if (nb) nb.onclick = () => { if (!("Notification" in window)) return toast(t("notif_na")); Notification.requestPermission().then(() => { const st = $("#notifst"); if (st) st.textContent = notifState(); }); };
  A.querySelectorAll("#perday button").forEach(b => b.onclick = () => { S.daily = +b.dataset.v; rebuildSet(); save(); render(); });
  bindHome(A); bindCustom(A); bindHealth(A); bindProj(A); bindRewards(A);
  const pe2 = $("#pjentry2"); if (pe2) pe2.onclick = () => { view = "proj"; render(); scrollTo(0, 0); };
  const wh = $("#who"); if (wh) wh.onclick = profileSheet;
  const fb = $("#fabtask"); if (fb) fb.onclick = addTaskSheet;
  A.querySelectorAll("[data-crdone]").forEach(b => b.onclick = () => { const r = S.custRem.find(x => x.id === b.dataset.crdone); markCr(r.id); render(); celebrate(1, [], "✓ " + r.label); });
  A.querySelectorAll("[data-ron]").forEach(c => c.onchange = () => { if (c.checked) delete S.roff[c.dataset.ron]; else S.roff[c.dataset.ron] = true; save(); render(); });
  const ex = $("#export"); if (ex) ex.onclick = () => download(`focus-backup-${(prof().name || "me").replace(/[^\w-]+/g, "_")}-${todayStr()}.json`, JSON.stringify(Object.assign({}, S, {profile: prof()}), null, 1), "application/json");
  const ea = $("#exportall"); if (ea) ea.onclick = () => download(`focus-backup-all-users-${todayStr()}.json`, JSON.stringify(exportAll(), null, 1), "application/json");
  const im = $("#import"); if (im) im.onchange = () => { const f = im.files[0]; if (!f) return; f.text().then(txt => { const o = JSON.parse(txt); if (!o || o.v !== 1) throw 0;
    if (o.all) { if (!confirm(t("import_all_q"))) return; importAll(o); } else { delete o.profile; S = Object.assign(fresh(), o); save(); refreshEx(); }
    render(); toast(t("imported")); }).catch(() => toast(t("import_err"))); };
  const rs = $("#reset"); if (rs) rs.onclick = () => { if (confirm(t("reset_q"))) { localStorage.removeItem(pkey(P.cur)); S = fresh(); save(); view = "home"; render(); } };
}

// ---------- boot ----------
loadP(); S = load(); save(); refreshEx(); render();
if (!prof().name) setTimeout(() => userForm(prof(), true), 50);       // first run (or first run after the profiles update) asks for a name
if (location.protocol === "https:" && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
window.FA = {reward, rhythm, lvInfo, levelOf, xpFor, wallet, winsToday, winsSheet, celebrate, applyTheme, set luck(v) { forceLuck = v; }, pjCreate, pjSchedule, pjWeek, pjDone, pjUndo, pjLater, pjSkip, pjPush, pjSetTarget, pjMove, pjAddStep, pjDelStep, pjEdit, pjLoad, pjDue, pjIcsEvents, stepSheet, newProjSheet, mondayOf, addMonths, stx, get curProj() { return curProj; }, set curProj(v) { curProj = v; }, rDone, rSkip, rToggle, nextSite, healthIcs, rrule, cycleStats, periodPrompt, periodAnswer, rNext, rDue, hDue, waterKey, addRoutine, healthSheet, addWater, get S() { return S; }, get P() { return P; }, switchProfile, exportAll, render, runTool, genMonth, icsText, complete, famOf, todaySet, genSet, runSetItem, checkRemind, addTask, runTask, set view(v) { view = v; render(); }};
setInterval(checkRemind, 30000 * SPEED); setTimeout(checkRemind, 900 * SPEED);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkRemind(); });
</script>
